[workspace]
resolver = "2"
exclude = ["third_party/wavicle"]
members = [
    "crates/seasound-model",
    "crates/seasound-plugin-api",
    "crates/seasound-media",
    "crates/seasound-playback",
    "crates/seasound-ui",
    "plugins/seasound-decoder-wavpack",
    "plugins/seasound-plugin-badabi",
    "apps/seasound",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seasound-model = { path = "crates/seasound-model" }
seasound-plugin-api = { path = "crates/seasound-plugin-api" }
seasound-media = { path = "crates/seasound-media" }
seasound-playback = { path = "crates/seasound-playback" }
seasound-ui = { path = "crates/seasound-ui" }
